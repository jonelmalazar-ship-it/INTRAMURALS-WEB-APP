<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACHS INTRAMURALS 2026</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(22, 27, 34, 0.88);
            --border-color: #30363d;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
            --accent-green: #238636;
            --text-color: #c9d1d9;
            --heading-color: #f0f6fc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            padding: 20px 15px; 
            min-height: 100vh;
            position: relative;
        }

        .bg-slider {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: opacity 1.2s ease-in-out;
            opacity: 0;
        }

        .bg-slider.active { opacity: 1; }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-color: #000;
            opacity: 0.6;
            transition: opacity 0.3s ease;
        }

        .container { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; }
        
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; justify-content: center; }
        .tab-btn { padding: 10px 20px; background: #161b22; border: 1px solid var(--border-color); color: #fff; border-radius: 8px; cursor: pointer; font-weight: bold; width: auto; }
        .tab-btn.active { background: var(--accent-green); border-color: var(--accent-green); }

        .tab-content { display: none; width: 100%; }
        .tab-content.active { display: block; }

        .card, .section { 
            background-color: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            padding: 22px; 
            margin-bottom: 25px; 
            width: 100%; 
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        h1 { 
            color: var(--gold); 
            text-align: center; 
            margin-bottom: 10px; 
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            font-size: clamp(1.6rem, 4.5vw, 2.6rem);
            font-weight: 800;
        }

        h2 { 
            color: var(--heading-color); 
            font-size: 1.15rem; 
            margin-bottom: 18px; 
            border-bottom: 1px solid var(--border-color); 
            padding-bottom: 12px; 
        }
        
        label { display: block; font-size: 0.9rem; color: #8b949e; margin-top: 12px; }
        input, select, button { width: 100%; padding: 12px; margin-top: 6px; margin-bottom: 12px; border-radius: 8px; border: 1px solid var(--border-color); background-color: #161b22; color: #fff; }
        button { background-color: var(--accent-green); font-weight: bold; cursor: pointer; border: none; }
        
        .action-btn-group { display: flex; gap: 15px; flex-wrap: wrap; }
        .btn-download { background-color: #2ea44f; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; }
        .btn-reset { background-color: #da3633; color: white; border: none; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; flex: 1; }
        
        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 14px 10px; border-bottom: 1px solid var(--border-color); }
        th { background-color: rgba(33, 38, 45, 0.9); color: #8b949e; font-size: 0.75rem; text-transform: uppercase; }

        @media (max-width: 600px) {
            body { padding: 12px 8px; }
            .section, .card { padding: 16px 12px; }
            th, td { padding: 10px 6px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div id="bg1" class="bg-slider active"></div>
    <div id="bg2" class="bg-slider"></div>
    <div id="bg-overlay" class="bg-overlay"></div>

    <div class="container">
        <h1>🏆 ACHS INTRAMURALS 2026 🏆</h1>
        
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'public-tab')">📊 Public Leaderboard</button>
            <button class="tab-btn" onclick="switchTab(event, 'admin-tab')">🔒 Admin Panel</button>
        </div>

        <div id="public-tab" class="tab-content active">
            <div class="section">
                <h2>📊 Overall Faction Standings</h2>
                <div class="table-responsive">
                    <table class="standings-table">
                        <thead>
                            <tr><th>RANK</th><th>FACTION</th><th>🥇 GOLD</th><th>🥈 SILVER</th><th>🥉 BRONZE</th><th>TOTAL</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>

            <div class="section">
                <h2>📜 Completed Events Log</h2>
                <div class="table-responsive">
                    <table class="events-log-table">
                        <thead>
                            <tr><th>CATEGORY</th><th>EVENT</th><th>🥇 GOLD</th><th>🥈 SILVER</th><th>🥉 BRONZE</th></tr>
                        </thead>
                        <tbody></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div id="admin-tab" class="tab-content">
            <div id="login-container" class="card" style="max-width: 400px; margin: 0 auto; text-align: center;">
                <h2>🔒 Admin Login</h2>
                <label>Enter Passcode:</label>
                <input type="password" id="admin-pin" placeholder="****" maxlength="4" style="text-align: center; font-size: 1.2rem;">
                <button onclick="checkPin()">LOGIN</button>
            </div>

            <div id="admin-panel" style="display: none; width: 100%;">
                <div class="card">
                    <h2>⚙️ Display & Background Settings</h2>
                    <label>⏱️ Slideshow Interval (seconds):</label>
                    <input type="number" id="interval-input" min="1" max="60" value="5">

                    <label>☀️ Background Darkness Overlay (<span id="brightness-val">60%</span>):</label>
                    <input type="range" id="brightness-input" min="10" max="90" value="60" oninput="updateOverlayOpacity(this.value)">
                </div>

                <div class="card">
                    <h2>⚡ Management Actions</h2>
                    <div class="action-btn-group">
                        <button class="btn-download" onclick="window.print()">🖨️ Print Report (PDF)</button>
                        <button id="reset-btn" class="btn-reset" onclick="resetTallyData()">⚠️ Rezero / Reset Tally Data</button>
                    </div>
                </div>

                <div class="card">
                    <h2>🏅 Add Game Result</h2>
                    <label>Category:</label>
                    <select id="category-select"><option value="Boys">Boys</option><option value="Girls">Girls</option><option value="Mixed">Mixed</option></select>

                    <label>Event Name:</label>
                    <input type="text" id="event-input" placeholder="e.g. Basketball">

                    <label>🥇 Gold Medalist:</label>
                    <select id="gold-select">
                        <option value="">-- Select Faction --</option>
                        <option value="Moniyan Empire">Moniyan Empire</option>
                        <option value="Abyssal Domain">Abyssal Domain</option>
                        <option value="Cadia Riverlands">Cadia Riverlands</option>
                        <option value="Eruditio">Eruditio</option>
                    </select>

                    <label>🥈 Silver Medalist:</label>
                    <select id="silver-select">
                        <option value="">-- Select Faction --</option>
                        <option value="Moniyan Empire">Moniyan Empire</option>
                        <option value="Abyssal Domain">Abyssal Domain</option>
                        <option value="Cadia Riverlands">Cadia Riverlands</option>
                        <option value="Eruditio">Eruditio</option>
                    </select>

                    <label>🥉 Bronze Medalist:</label>
                    <select id="bronze-select">
                        <option value="">-- Select Faction --</option>
                        <option value="Moniyan Empire">Moniyan Empire</option>
                        <option value="Abyssal Domain">Abyssal Domain</option>
                        <option value="Cadia Riverlands">Cadia Riverlands</option>
                        <option value="Eruditio">Eruditio</option>
                    </select>

                    <button id="submit-btn" onclick="submitGameResult()">UPDATE TALLY</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw3Dj2eV8lmZt-3NwN-OkjhmDPs0t4mKkJHJp6tzZizyt2t5uL3FNJdXYoKuPFaVQoY/exec";

        const bgImages = [
            "https://images.unsplash.com/photo-1517649763962-0c6232661a0b?q=80&w=1920",
            "https://images.unsplash.com/photo-1461896836934-ffe607ba8211?q=80&w=1920",
            "https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?q=80&w=1920"
        ];
        
        let currentBgIndex = 0;
        let activeSlider = 1;

        function startBgSlideshow() {
            if (bgImages.length === 0) return;
            
            const bg1 = document.getElementById('bg1');
            const bg2 = document.getElementById('bg2');
            bg1.style.backgroundImage = `url('${bgImages[0]}')`;

            setInterval(() => {
                currentBgIndex = (currentBgIndex + 1) % bgImages.length;
                const nextImage = bgImages[currentBgIndex];

                if (activeSlider === 1) {
                    bg2.style.backgroundImage = `url('${nextImage}')`;
                    bg2.classList.add('active');
                    bg1.classList.remove('active');
                    activeSlider = 2;
                } else {
                    bg1.style.backgroundImage = `url('${nextImage}')`;
                    bg1.classList.add('active');
                    bg2.classList.remove('active');
                    activeSlider = 1;
                }
            }, 5000);
        }

        function updateOverlayOpacity(val) {
            document.getElementById('brightness-val').innerText = val + '%';
            document.getElementById('bg-overlay').style.opacity = val / 100;
        }

        function switchTab(evt, tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            evt.currentTarget.classList.add('active');
        }

        function checkPin() {
            if (document.getElementById("admin-pin").value === "2026") {
                document.getElementById("login-container").style.display = "none";
                document.getElementById("admin-panel").style.display = "block";
            } else {
                alert("Maling Passcode!");
            }
        }

        function fetchTallyData() {
            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    const tbodyStandings = document.querySelector(".standings-table tbody");
                    const tbodyLogs = document.querySelector(".events-log-table tbody");

                    tbodyStandings.innerHTML = "";
                    tbodyLogs.innerHTML = "";

                    if (data.standings) {
                        data.standings.forEach((item, i) => {
                            tbodyStandings.innerHTML += `
                                <tr>
                                    <td>#${i + 1}</td>
                                    <td><strong>${item.faction}</strong></td>
                                    <td>🥇 ${item.gold}</td>
                                    <td>🥈 ${item.silver}</td>
                                    <td>🥉 ${item.bronze}</td>
                                    <td><strong>${item.total}</strong></td>
                                </tr>`;
                        });
                    }

                    if (data.logs) {
                        data.logs.slice().reverse().forEach(log => {
                            tbodyLogs.innerHTML += `
                                <tr>
                                    <td>${log.category || 'Boys'}</td>
                                    <td><strong>${log.event}</strong></td>
                                    <td>🥇 ${log.gold || ""}</td>
                                    <td>🥈 ${log.silver || ""}</td>
                                    <td>🥉 ${log.bronze || ""}</td>
                                </tr>`;
                        });
                    }
                })
                .catch(err => console.error("Error fetching data:", err));
        }

        function resetTallyData() {
            if (prompt("⚠️ PERMANENT DELETE WARNING ⚠️\n\nI-type ang 'RESET' upang burahin ang tally:") !== "RESET") return;

            const formData = new URLSearchParams();
            formData.append("action", "reset");

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData.toString()
            }).then(() => {
                alert("✅ Matagumpay na na-reset ang data!");
                fetchTallyData();
            });
        }

        function submitGameResult() {
            const formData = new URLSearchParams();
            formData.append("category", document.getElementById("category-select").value);
            formData.append("event", document.getElementById("event-input").value);
            formData.append("gold", document.getElementById("gold-select").value);
            formData.append("silver", document.getElementById("silver-select").value);
            formData.append("bronze", document.getElementById("bronze-select").value);

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: formData.toString()
            }).then(() => {
                alert("✅ Matagumpay na naidagdag!");
                document.getElementById("event-input").value = "";
                fetchTallyData();
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchTallyData();
            startBgSlideshow();
        });
    </script>
</body>
</html>
