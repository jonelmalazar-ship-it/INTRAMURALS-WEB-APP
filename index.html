<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACHS Intramurals 2026 - Control Center</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 31, 49, 0.8);
            --primary: #00ffcc;
            --accent: #ff0055;
            --text: #ffffff;
            --gold: #ffd700;
            --silver: #c0c0c0;
            --bronze: #cd7f32;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
            margin-bottom: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(0, 255, 204, 0.2);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px);
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
            border-bottom: 2px solid var(--primary);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #333;
            background: #1a233a;
            color: #fff;
            box-sizing: border-box;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, var(--primary), #0099ff);
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
            box-shadow: 0 0 15px var(--primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #2a3a5e;
        }

        th {
            background-color: #162447;
            color: var(--primary);
        }

        /* Floating BGM HUD */
        .audio-hud {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(11, 15, 25, 0.95);
            border: 2px solid var(--primary);
            box-shadow: 0 0 15px var(--primary);
            border-radius: 30px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            z-index: 9999;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            background-color: #ff3333;
            border-radius: 50%;
            box-shadow: 0 0 8px #ff3333;
        }

        .status-dot.active {
            background-color: var(--primary);
            box-shadow: 0 0 8px var(--primary);
        }
    </style>
</head>
<body>

    <h1>ACHS INTRAMURALS 2026</h1>

    <div class="container">
        <!-- SCORE EVENT ENTRY FORM -->
        <div class="card">
            <h2>🏆 Submit Match Result</h2>
            <form id="score-form">
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="Ball Games">Ball Games</option>
                        <option value="Board Games">Board Games</option>
                        <option value="E-Sports">E-Sports</option>
                        <option value="Track & Field">Track & Field</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="event">Event Name</label>
                    <input type="text" id="event" placeholder="e.g., Basketball Men's Finals" required>
                </div>
                <div class="form-group">
                    <label for="gold" style="color: var(--gold);">🥇 Gold Winner</label>
                    <select id="gold" required>
                        <option value="">Select Faction</option>
                        <option value="Moniyan Empire">Moniyan Empire</option>
                        <option value="Eruditio">Eruditio</option>
                        <option value="Abyssal Domain">Abyssal Domain</option>
                        <option value="Cadia Riverlands">Cadia Riverlands</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="silver" style="color: var(--silver);">🥈 Silver Winner</label>
                    <select id="silver" required>
                        <option value="">Select Faction</option>
                        <option value="Moniyan Empire">Moniyan Empire</option>
                        <option value="Eruditio">Eruditio</option>
                        <option value="Abyssal Domain">Abyssal Domain</option>
                        <option value="Cadia Riverlands">Cadia Riverlands</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="bronze" style="color: var(--bronze);">🥉 Bronze Winner</label>
                    <select id="bronze" required>
                        <option value="">Select Faction</option>
                        <option value="Moniyan Empire">Moniyan Empire</option>
                        <option value="Eruditio">Eruditio</option>
                        <option value="Abyssal Domain">Abyssal Domain</option>
                        <option value="Cadia Riverlands">Cadia Riverlands</option>
                    </select>
                </div>
                <button type="submit" id="submit-btn">PUBLISH RESULT</button>
            </form>
        </div>

        <!-- MEDAL STANDINGS BOARD -->
        <div class="card">
            <h2>📊 Overall Tally Standings</h2>
            <table>
                <thead>
                    <tr>
                        <th>Faction</th>
                        <th>🥇 Gold</th>
                        <th>🥈 Silver</th>
                        <th>🥉 Bronze</th>
                    </tr>
                </thead>
                <tbody id="standings-table">
                    <tr><td colspan="4">Loading data from server...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- AUDIO ENGINE PLAYER -->
    <audio id="bgm-player" loop preload="auto">
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <!-- FLOATING BGM HUD BUTTON -->
    <div class="audio-hud" onclick="manualToggleAudio()">
        <div class="status-dot" id="hud-dot"></div>
        <span id="hud-text" style="font-weight: bold;">BGM: CLICK ANYWHERE TO START</span>
    </div>

    <script>
        // ============================================================
        // 1. CONFIGURATION (PASTE YOUR APPS SCRIPT WEB APP URL HERE)
        // ============================================================
        const API_ENDPOINT = "YOUR_APPS_SCRIPT_WEB_APP_URL_HERE";

        // ============================================================
        // 2. ULTRA-INTERCEPTOR AUDIO ENGINE (ZERO BLOCK BYPASS)
        // ============================================================
        let audioContext = null;
        const bgm = document.getElementById("bgm-player");
        const hudDot = document.getElementById("hud-dot");
        const hudText = document.getElementById("hud-text");
        let isAudioUnlocked = false;

        function forceUnlockAudioPipeline() {
            if (isAudioUnlocked) return;

            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            bgm.play().then(() => {
                isAudioUnlocked = true;
                hudDot.classList.add("active");
                hudText.innerText = "BGM SYSTEM ONLINE 🔊";

                // Remove global listeners once fully unlocked
                window.removeEventListener('click', forceUnlockAudioPipeline, true);
                window.removeEventListener('touchstart', forceUnlockAudioPipeline, true);
                window.removeEventListener('keydown', forceUnlockAudioPipeline, true);
                window.removeEventListener('scroll', forceUnlockAudioPipeline, true);
            }).catch(() => {
                // Awaits next user touch gesture
            });
        }

        function manualToggleAudio() {
            if (!isAudioUnlocked) {
                forceUnlockAudioPipeline();
            }

            if (bgm.paused) {
                bgm.play();
                hudDot.classList.add("active");
                hudText.innerText = "BGM SYSTEM ONLINE 🔊";
            } else {
                bgm.pause();
                hudDot.classList.remove("active");
                hudText.innerText = "BGM PAUSED ⏸️";
            }
        }

        // Global Interceptors: Triggers unlock on the first user interaction
        window.addEventListener('click', forceUnlockAudioPipeline, true);
        window.addEventListener('touchstart', forceUnlockAudioPipeline, true);
        window.addEventListener('keydown', forceUnlockAudioPipeline, true);
        window.addEventListener('scroll', forceUnlockAudioPipeline, true);

        // ============================================================
        // 3. APPS SCRIPT BACKEND SYNC (FETCH & POST)
        // ============================================================
        async function fetchStandings() {
            if (!API_ENDPOINT || API_ENDPOINT.includes("YOUR_APPS_SCRIPT")) return;
            
            try {
                const res = await fetch(API_ENDPOINT);
                const data = await res.json();
                
                if (data.standings) {
                    const tbody = document.getElementById("standings-table");
                    tbody.innerHTML = "";
                    data.standings.forEach(row => {
                        tbody.innerHTML += `
                            <tr>
                                <td><strong>${row.faction}</strong></td>
                                <td>${row.gold}</td>
                                <td>${row.silver}</td>
                                <td>${row.bronze}</td>
                            </tr>
                        `;
                    });
                }
            } catch (err) {
                console.error("Fetch Error:", err);
            }
        }

        document.getElementById("score-form").addEventListener("submit", async (e) => {
            e.preventDefault();
            const btn = document.getElementById("submit-btn");
            btn.innerText = "PUBLISHING...";
            btn.disabled = true;

            const payload = new URLSearchParams({
                category: document.getElementById("category").value,
                event: document.getElementById("event").value,
                gold: document.getElementById("gold").value,
                silver: document.getElementById("silver").value,
                bronze: document.getElementById("bronze").value
            });

            try {
                await fetch(API_ENDPOINT, {
                    method: "POST",
                    body: payload
                });
                alert("Match Result Published Successfully!");
                document.getElementById("score-form").reset();
                fetchStandings();
            } catch (err) {
                alert("Failed to submit result. Check API Endpoint.");
            } finally {
                btn.innerText = "PUBLISH RESULT";
                btn.disabled = false;
            }
        });

        // Initial Data Fetch & Auto Polling
        fetchStandings();
        setInterval(fetchStandings, 5000);
    </script>
</body>
</html>
